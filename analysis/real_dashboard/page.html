<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real run dashboard</title>
<style>
:root {
  --bg: #f6f6f3; --card: #ffffff; --fg: #1c1c1c; --muted: #6b6b6b; --line: #dcdcd6;
  --grid: #ececE6; --ours: #0072B2; --out: #D55E00; --ink: #1c1c1c; --ref: #999999;
  --prompt-bg: #fff4d6; --prompt-line: #E69F00; --tape: #c9a227;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121314; --card: #1c1d1f; --fg: #e8e8e6; --muted: #9a9a96; --line: #34363a;
    --grid: #2a2c2f; --ink: #f0f0ee; --prompt-bg: #3a2f12; --tape: #b8942a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: baseline; gap: 16px; padding: 14px 20px 6px; flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0; font-weight: 600; }
header .meta { color: var(--muted); font-size: 12px; }
header .meta.stale { color: var(--out); font-weight: 600; }
main { display: grid; gap: 14px; padding: 8px 20px 24px;
  grid-template-columns: repeat(12, minmax(0, 1fr)); }
section { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px 14px; min-width: 0; }
section h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .04em; }
#status { grid-column: span 12; }
#eval-curve { grid-column: span 7; }
#camera { grid-column: span 5; grid-row: span 2; }
#tosses { grid-column: span 7; }
#details { grid-column: span 12; }
@media (max-width: 1100px) { #eval-curve, #camera, #tosses { grid-column: span 12; grid-row: auto; } }
.strip { display: flex; gap: 10px; flex-wrap: wrap; }
.strip .item { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-width: 130px; }
.strip .item.grow { flex: 1 1 260px; }
.strip .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.strip .v { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.strip .s { font-size: 12px; color: var(--muted); }
.strip .item.stale { border-color: var(--out); background: color-mix(in srgb, var(--out) 14%, transparent); }
.strip .item.stale .v, .strip .item.stale .s { color: var(--out); }
.camera-wrap { position: relative; width: 100%; }
.camera-wrap img { display: block; width: 100%; height: auto; border-radius: 4px; }
.camera-wrap svg.overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: auto; }
svg .overlay-label { fill: #ffffff; font: 600 28px system-ui, sans-serif; paint-order: stroke; stroke: #000000; stroke-width: 4px; }
.legend .key::before { border-radius: 0; height: 4px; vertical-align: 3px; width: 16px; }
.legend .spot::before { background: repeating-linear-gradient(90deg, var(--muted) 0 5px, transparent 5px 8px); }
.legend .bin::before { background: #F0E442; }
.legend .tape::before { background: #E69F00; }
.legend .robot::before { background: var(--muted); }
details.more > summary { cursor: pointer; font-weight: 600; color: var(--muted); }
#room-fallback svg { max-width: 560px; }
#details .row svg { max-width: 420px; }
details.more h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 16px 0 6px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.tile .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.tile .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 12px; color: var(--muted); }
.bar { height: 6px; background: var(--grid); border-radius: 3px; margin-top: 4px; overflow: hidden; }
.bar > div { height: 100%; background: var(--ours); }
.wide { grid-column: span 2; }
.prompt { margin-top: 10px; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--line); }
.prompt.waiting { background: var(--prompt-bg); border-color: var(--prompt-line); }
.prompt .q { font-size: 16px; font-weight: 600; }
.prompt .c { color: var(--muted); font-size: 13px; }
details { margin-top: 8px; }
pre { margin: 6px 0 0; font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap;
  max-height: 220px; overflow: auto; background: var(--bg); padding: 8px; border-radius: 6px; }
svg { display: block; width: 100%; height: auto; }
svg text { fill: var(--fg); font: 11px system-ui, sans-serif; }
svg .muted { fill: var(--muted); }
svg .axis { stroke: var(--muted); stroke-width: 1; }
svg .grid { stroke: var(--grid); stroke-width: 1; }
.row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.two { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
@media (max-width: 800px) { .two, .row { grid-template-columns: 1fr; } .wide { grid-column: auto; } }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
.note { color: var(--muted); font-size: 12px; margin-top: 6px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 4px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 5px;
  vertical-align: -1px; border-radius: 50%; }
.legend .in::before { background: var(--ink); }
.legend .out::before { content: "\00d7"; width: auto; height: auto; color: var(--out); font-weight: 700; }
.legend .unk::before { border: 1.5px solid var(--ref); }
.legend .diamond::before { border-radius: 0; width: 8px; height: 8px; border: 2px solid var(--ink); transform: rotate(45deg); }
.legend .ring::before { background: #ffffff; border: 2px solid #000000; }
</style>
</head>
<body>
<header>
  <h1>Tossing3D (real) — practice run</h1>
  <span class="meta" id="run-dir"></span>
  <span class="meta" id="updated">loading …</span>
</header>
<main>
  <section id="status"><div id="status-body"></div></section>
  <section id="eval-curve"><h2>Evaluation, solved per cycle</h2><div id="eval-body"></div></section>
  <section id="camera"><h2>Ceiling camera, map overlaid</h2><div id="camera-body"></div></section>
  <section id="tosses"><h2>Practice tosses</h2><div id="tosses-body"></div></section>
  <section id="details"><details class="more"><summary>Details</summary>
    <h3>Toss parameters</h3><div id="toss-params-body"></div>
    <h3>Room, map frame (m)</h3><div id="room-fallback"></div>
    <h3>Skills: timing, picks, competence</h3><div id="timing-body"></div>
    <h3>Session log and events</h3><div id="log-body"></div>
  </details></section>
</main>
<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const POLL_MS = 5000;

function el(tag, attrs, ...kids) {
  const node = tag.startsWith("svg:") ? document.createElementNS(NS, tag.slice(4)) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) node.setAttribute(k, v);
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined)
    node.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
  return node;
}
const s = (tag, attrs, ...kids) => el("svg:" + tag, attrs, ...kids);
const title = (text) => s("title", {}, text);
const fmt = (v, d = 0) => (v === null || v === undefined || Number.isNaN(v)) ? "—" : Number(v).toFixed(d);
function hms(seconds) {
  if (seconds === null || seconds === undefined) return "—";
  const t = Math.round(seconds), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
  return (h ? h + "h " : "") + String(m).padStart(h ? 2 : 1, "0") + "m " + String(sec).padStart(2, "0") + "s";
}
function niceTicks(lo, hi, count) {
  const span = hi - lo || 1, raw = span / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((f) => f * mag).find((f) => span / f <= count) || mag * 10;
  const ticks = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) ticks.push(+v.toFixed(10));
  return ticks;
}

// A plot frame: returns the svg, scales and the plotting group.
function frame({ w, h, m, x, y, xticks, yticks, xlabel, ylabel, xfmt, yfmt }) {
  const svg = s("svg", { viewBox: `0 0 ${w} ${h}`, role: "img" });
  const sx = (v) => m.l + (v - x[0]) / (x[1] - x[0] || 1) * (w - m.l - m.r);
  const sy = (v) => h - m.b - (v - y[0]) / (y[1] - y[0] || 1) * (h - m.t - m.b);
  for (const t of yticks) {
    svg.appendChild(s("line", { class: "grid", x1: m.l, x2: w - m.r, y1: sy(t), y2: sy(t) }));
    svg.appendChild(s("text", { x: m.l - 6, y: sy(t) + 4, "text-anchor": "end", class: "muted" }, (yfmt || String)(t)));
  }
  for (const t of xticks) {
    svg.appendChild(s("line", { class: "axis", x1: sx(t), x2: sx(t), y1: h - m.b, y2: h - m.b + 4 }));
    svg.appendChild(s("text", { x: sx(t), y: h - m.b + 16, "text-anchor": "middle", class: "muted" }, (xfmt || String)(t)));
  }
  svg.appendChild(s("line", { class: "axis", x1: m.l, x2: w - m.r, y1: h - m.b, y2: h - m.b }));
  svg.appendChild(s("line", { class: "axis", x1: m.l, x2: m.l, y1: m.t, y2: h - m.b }));
  if (xlabel) svg.appendChild(s("text", { x: (m.l + w - m.r) / 2, y: h - 4, "text-anchor": "middle" }, xlabel));
  if (ylabel) svg.appendChild(s("text", { x: 12, y: (m.t + h - m.b) / 2, "text-anchor": "middle",
    transform: `rotate(-90 12 ${(m.t + h - m.b) / 2})` }, ylabel));
  return { svg, sx, sy };
}

// In bin: a filled ink dot. Out: a vermillion cross. Unknown: a hollow grey ring.
function outcomeMark(cx, cy, inBin, r, tip, opacity) {
  const o = opacity === undefined ? 1 : opacity;
  if (inBin === true) return s("circle", { cx, cy, r, fill: "var(--ink)", opacity: o }, title(tip));
  if (inBin === false) {
    const d = r * 0.9;
    return s("path", { d: `M${cx - d},${cy - d}L${cx + d},${cy + d}M${cx - d},${cy + d}L${cx + d},${cy - d}`,
      stroke: "var(--out)", "stroke-width": 2, opacity: o, fill: "none" }, title(tip));
  }
  return s("circle", { cx, cy, r, fill: "none", stroke: "var(--ref)", "stroke-width": 1.5, opacity: o }, title(tip));
}
const outcomeWord = (v) => v === true ? "in bin" : v === false ? "not in bin" : "outcome unknown";

function tile(k, v, sub, extra) {
  return el("div", { class: "tile" + (extra && extra.wide ? " wide" : "") }, el("div", { class: "k" }, k),
    el("div", { class: "v" }, v), sub ? el("div", { class: "s" }, sub) : null, extra && extra.bar !== undefined
      ? el("div", { class: "bar" }, el("div", { style: `width:${Math.min(100, 100 * extra.bar)}%` })) : null);
}

// One strip: cycle, steps, the skill, resets, and how fresh the run's logs are.
function renderStatus(st) {
  const body = document.getElementById("status-body");
  const budget = st.step_budget || 0;
  const proj = st.projected_cycles ? `~${fmt(st.projected_cycles)}` : "?";
  const skill = st.running ? st.running : (st.last_skill ? `${st.last_skill}` : "—");
  const skillSub = st.running ? "running now" : (st.last_skill_detail ? "last: " + st.last_skill_detail : "last finished");
  const item = (k, v, sub, extra) => el("div", { class: "item" + (extra || "") }, el("div", { class: "k" }, k),
    el("div", { class: "v" }, v), sub ? el("div", { class: "s" }, sub) : null);
  const steps = item("Steps", `${st.practice_steps.toLocaleString()} / ${budget ? budget.toLocaleString() : "?"}`, null);
  if (budget) steps.appendChild(el("div", { class: "bar" }, el("div", { style: `width:${Math.min(100, 100 * st.practice_steps / budget)}%` })));
  const strip = el("div", { class: "strip" },
    item("Cycle", `${st.cycle} / ${proj}`, st.projected_cycles ? "projected at this pace" : "no cycle finished yet"),
    steps,
    item("Skill", skill, skillSub, " grow"),
    item("Human resets", `SAME ${st.human_resets.SAME || 0} · FAR ${st.human_resets.FAR || 0}`, null),
    el("div", { class: "item" + (st.stale ? " stale" : ""), id: "freshness" }, el("div", { class: "k" }, "Last updated"),
      el("div", { class: "v", id: "logs-age" }, ""), el("div", { class: "s" }, st.stale
        ? "a skill is running and no log has changed for over 3 min" : "newest write to the run's logs")));
  logsAge = { seconds: st.logs_age_seconds, at: Date.now(), stale: st.stale, running: !!st.running };
  const since = st.prompt_since ? Date.parse(st.prompt_since.replace(" ", "T")) : null;
  const prompt = st.prompt
    ? el("div", { class: "prompt waiting" }, el("div", { class: "q" }, "Waiting for the person: " + st.prompt),
        el("div", { class: "c" }, (st.prompt_context ? st.prompt_context + " · " : "") + (since ? "asked " + hms((Date.now() - since) / 1000) + " ago" : "")))
    : null;
  body.replaceChildren(strip, prompt || "");
  tickAge();
}

// The age counts up between polls, so a stalled server or run is visible too.
let logsAge = null;
function tickAge() {
  const node = document.getElementById("logs-age");
  if (!node || !logsAge) return;
  if (logsAge.seconds === null || logsAge.seconds === undefined) { node.textContent = "—"; return; }
  const age = logsAge.seconds + (Date.now() - logsAge.at) / 1000;
  node.textContent = hms(age) + " ago";
  const stale = logsAge.running && age > 180;
  document.getElementById("freshness").className = "item" + (stale ? " stale" : "");
}

function renderEval(curve) {
  const body = document.getElementById("eval-body");
  const pts = curve.points.map((p) => Object.assign({ x: p.cycle ?? p.index }, p));
  const total = Math.max(1, ...pts.map((p) => p.total));
  const totals = [...new Set(pts.map((p) => p.total))];
  const xmax = Math.max(1, ...pts.map((p) => p.x));
  const { svg, sx, sy } = frame({ w: 720, h: 220, m: { l: 46, r: 16, t: 24, b: 40 }, x: [0, xmax], y: [0, total],
    xticks: niceTicks(0, xmax, 10).filter(Number.isInteger), yticks: niceTicks(0, total, Math.min(total, 6)).filter((t) => Number.isInteger(t)),
    xlabel: "cycle (learning updates before the evaluation)", ylabel: "solved per evaluation" });
  const done = pts.filter((p) => p.complete);
  if (done.length > 1) svg.appendChild(s("polyline", { fill: "none", stroke: curve.colour, "stroke-width": 2.3,
    "stroke-dasharray": curve.dashed ? "8 4" : null, points: done.map((p) => `${sx(p.x)},${sy(p.solved)}`).join(" ") }));
  const every = Math.max(1, Math.ceil(pts.length / 20));
  pts.forEach((p, i) => {
    const tip = `evaluation ${p.index}: ${p.label} solved after cycle ${p.cycle ?? "?"}, at ${p.practice_steps} practice steps` + (p.complete ? "" : " (running)");
    // A human correction sits beside the recorded marker: thin connector, hollow marker.
    if (p.corrected !== null && p.corrected !== undefined) {
      const why = `corrected (human-confirmed): ${p.corrected_label}, recorded ${p.label}\n` + p.corrections.join("\n");
      svg.appendChild(s("line", { x1: sx(p.x), x2: sx(p.x), y1: sy(p.solved), y2: sy(p.corrected), stroke: curve.colour,
        "stroke-width": 1 }, title(why)));
      svg.appendChild(s("circle", { cx: sx(p.x), cy: sy(p.corrected), r: 5.5, fill: "var(--card)", stroke: curve.colour,
        "stroke-width": 2 }, title(why)));
      svg.appendChild(s("text", { x: sx(p.x) + 9, y: sy(p.corrected) + 4, class: "muted" }, p.corrected_label));
    }
    svg.appendChild(s("circle", { cx: sx(p.x), cy: sy(p.solved), r: 4.5, fill: p.complete ? curve.colour : "var(--card)",
      stroke: curve.colour, "stroke-width": 2, "stroke-dasharray": p.complete ? null : "2 2" }, title(tip)));
    if (i % every === 0 || i === pts.length - 1)
      svg.appendChild(s("text", { x: sx(p.x), y: sy(p.solved) - 9, "text-anchor": "middle" }, p.label));
  });
  const swatch = s("svg", { viewBox: "0 0 30 10", width: 30, height: 10, style: "display:inline-block;width:30px;vertical-align:-1px;margin-right:4px" },
    s("line", { x1: 0, x2: 30, y1: 5, y2: 5, stroke: curve.colour, "stroke-width": 2.3, "stroke-dasharray": curve.dashed ? "8 4" : null }),
    s("circle", { cx: 15, cy: 5, r: 3.5, fill: curve.colour }));
  const last = pts[pts.length - 1];
  const head = el("div", { class: "note" }, `Tossing3D (real) · tasks per evaluation: ${totals.length ? totals.join(", ") : "—"}` +
    (last ? ` · latest ${last.label}` : "") + (pts.some((p) => !p.complete) ? " · dotted marker = evaluation still running" : ""));
  const leg = el("div", { class: "note" }, swatch, curve.legend + (curve.dashed ? " (no human reset)" : ""));
  const corrected = curve.corrected_legend ? el("div", { class: "note" },
    s("svg", { viewBox: "0 0 30 12", width: 30, height: 12, style: "display:inline-block;width:30px;vertical-align:-2px;margin-right:4px" },
      s("circle", { cx: 15, cy: 6, r: 4.5, fill: "var(--card)", stroke: curve.colour, "stroke-width": 2 })),
    curve.corrected_legend + " · recorded numbers unchanged; hover for why") : "";
  body.replaceChildren(head, svg, leg, corrected, pts.length ? "" : el("div", { class: "note" }, "No evaluation yet."));
}

// A compact strip: one mark per practice toss, in or out, with the running count.
function renderTossStrip(t) {
  const body = document.getElementById("tosses-body");
  const pts = t.points, n = pts.length;
  const xmax = Math.max(n - 1, 1);
  const f = frame({ w: 720, h: 96, m: { l: 40, r: 30, t: 8, b: 26 }, x: [-0.5, xmax + 0.5], y: [-0.3, 1.3],
    xticks: niceTicks(0, xmax, 10).filter(Number.isInteger), yticks: [], xfmt: String });
  f.svg.appendChild(s("text", { x: 34, y: f.sy(1) + 4, "text-anchor": "end", class: "muted" }, "in"));
  f.svg.appendChild(s("text", { x: 34, y: f.sy(0) + 4, "text-anchor": "end", class: "muted" }, "out"));
  const r = n > 120 ? 2.5 : 4;
  pts.forEach((p) => {
    const cx = f.sx(p.index), cy = f.sy(p.in_bin === true ? 1 : p.in_bin === false ? 0 : 0.5);
    const tip = `toss ${p.index} (step ${p.step}, cycle ${p.cycle}, bin ${p.spot || "?"}): ${outcomeWord(p.in_bin)}` +
      (p.random === true ? `\n${EPSILON_NOTE}` : p.random === false ? "\ngreedy (counted toward competence)" : "") +
      `\nstandoff ${fmt(p.standoff, 2)} m · ${fmt(p.speed_deg_s)} deg/s · release ${fmt(p.release_ms)} ms` + (p.note ? "\n" + p.note : "");
    // An epsilon-random toss is a diamond: outlined in ink when in, vermillion when out.
    if (p.random === true) {
      const d = r + 2;
      f.svg.appendChild(s("polygon", { points: `${cx},${cy - d} ${cx + d},${cy} ${cx},${cy + d} ${cx - d},${cy}`, fill: "none",
        stroke: p.in_bin === true ? "var(--ink)" : p.in_bin === false ? "var(--out)" : "var(--ref)", "stroke-width": 2 }, title(tip)));
    } else f.svg.appendChild(outcomeMark(cx, cy, p.in_bin, r, tip));
  });
  const head = el("div", { class: "note" },
    el("b", {}, `in bin ${t.in_bin_label}`), ` all practice tosses · greedy ${t.greedy_label} · random ${t.random_label}` +
    ` · last ${t.rolling_window}: ${t.rolling_label}` + (t.outcome_source ? ` · from ${t.outcome_source}` : ""));
  const legend = el("div", { class: "legend" }, el("span", { class: "in" }, "in bin"), el("span", { class: "out" }, "not in bin"),
    el("span", { class: "diamond", title: EPSILON_NOTE }, "ε-random (not counted toward competence)"));
  body.replaceChildren(head, n ? f.svg : el("div", { class: "note" }, "No practice toss yet."), n ? legend : "");
}

// The method draws a random toss with probability epsilon = 0.5, but only once the
// toss sampler has a fit with both classes; before that epsilon is 0 (all greedy).
const EPSILON_NOTE = "ε-random draw: not counted toward competence. ε = 0.5 applies only once the toss sampler " +
  "has a fit with both classes (in and out); before that ε = 0 and every toss is greedy.";

// Details: each toss's three parameters against toss number.
function renderTossParams(t) {
  const body = document.getElementById("toss-params-body");
  const pts = t.points, n = pts.length, xmax = Math.max(n - 1, 1);
  if (!n) { body.replaceChildren(el("div", { class: "note" }, "No practice toss yet.")); return; }
  const panel = (key, label, d) => {
    const vals = pts.map((p) => p[key]);
    const lo = Math.min(...vals), hi = Math.max(...vals), pad = (hi - lo) * 0.1 || Math.abs(hi) * 0.05 || 1;
    const f = frame({ w: 240, h: 150, m: { l: 42, r: 8, t: 18, b: 30 }, x: [-0.5, xmax + 0.5], y: [lo - pad, hi + pad],
      xticks: niceTicks(0, xmax, 4).filter(Number.isInteger), yticks: niceTicks(lo - pad, hi + pad, 4), xlabel: "practice toss",
      yfmt: (v) => fmt(v, d) });
    f.svg.appendChild(s("text", { x: 42, y: 12 }, label));
    pts.forEach((p) => f.svg.appendChild(outcomeMark(f.sx(p.index), f.sy(p[key]), p.in_bin, n > 120 ? 2 : 3,
      `toss ${p.index}: ${label} ${fmt(p[key], d + 1)} — ${outcomeWord(p.in_bin)}`)));
    return f.svg;
  };
  body.replaceChildren(el("div", { class: "row" },
    panel("standoff", "standoff (m)", 2), panel("speed_deg_s", "speed (deg/s)", 0), panel("release_ms", "release (ms)", 0)));
}

// The newest ceiling frame with the map drawn on it; the plain map when there is none.
let cameraShown = false;
function renderCamera(camera, room) {
  const body = document.getElementById("camera-body");
  const fallback = document.getElementById("room-fallback");
  if (!camera || !camera.available || !camera.overlay) {
    cameraShown = false;
    const why = !camera ? "no camera configured (--camera-python)" :
      camera.error ? camera.error : camera.age_seconds !== null ? `newest frame is ${hms(camera.age_seconds)} old` : "no frame yet";
    body.replaceChildren(el("div", { class: "note" }, "Live camera unavailable: " + why + ". Showing the plain map."), el("div", { id: "room-in-camera" }));
    renderRoom(room, document.getElementById("room-in-camera"));
    fallback.replaceChildren(el("div", { class: "note" }, "The plain map is shown above, in place of the camera."));
    return;
  }
  const ov = camera.overlay;
  let wrap = document.getElementById("camera-wrap");
  if (!cameraShown || !wrap) {
    wrap = el("div", { class: "camera-wrap", id: "camera-wrap" },
      el("img", { id: "camera-img", alt: "ceiling cameras, stitched", src: "/api/camera.jpg?t=" + Date.now() }));
    body.replaceChildren(wrap, el("div", { class: "legend" }, el("span", { class: "in ring" }, "landing in bin"),
      el("span", { class: "out" }, "not in bin"), el("span", { class: "key spot" }, "SAME/FAR spot (rim)"),
      el("span", { class: "key bin" }, "bin, last observed (rim)"), el("span", { class: "key tape" }, "tape edges"),
      el("span", { class: "key robot" }, "robot, cube (floor)")), el("div", { class: "note", id: "camera-age" }, ""));
    cameraShown = true;
  }
  const svg = s("svg", { viewBox: `0 0 ${ov.width} ${ov.height}`, class: "overlay", preserveAspectRatio: "none" });
  const style = {
    tape: { stroke: "#E69F00", "stroke-width": 3, fill: "none" },
    spot: { stroke: "#ffffff", "stroke-width": 3, "stroke-dasharray": "10 6", fill: "none" },
    bin: { stroke: "#F0E442", "stroke-width": 3, fill: "none" },
    cube: { stroke: "#F0E442", "stroke-width": 3, fill: "none" },
    robot: { stroke: "#ffffff", "stroke-width": 3, fill: "rgba(255,255,255,0.25)" },
  };
  const landings = ov.shapes.filter((p) => p.kind === "landing");
  for (const shape of ov.shapes) {
    if (shape.kind === "landing") continue;
    const pts = shape.points.map(([u, v]) => `${u},${v}`).join(" ");
    const attrs = Object.assign({ points: pts }, style[shape.kind] || { stroke: "#ffffff", fill: "none" });
    svg.appendChild(s(shape.closed ? "polygon" : "polyline", attrs, title(shape.label)));
    if (shape.kind === "spot") {
      const [u, v] = shape.points[0];
      svg.appendChild(s("text", { x: u + 6, y: v - 8, class: "overlay-label" }, shape.label.split(" ")[0]));
    }
  }
  landings.forEach((p, i) => {
    const [u, v] = p.points[0], o = 0.45 + 0.55 * (i + 1) / landings.length;
    if (p.in_bin === true) svg.appendChild(s("circle", { cx: u, cy: v, r: 9, fill: "#ffffff", stroke: "#000000", "stroke-width": 3, opacity: o }, title(p.label + ": in bin")));
    else svg.appendChild(s("path", { d: `M${u - 9},${v - 9}L${u + 9},${v + 9}M${u - 9},${v + 9}L${u + 9},${v - 9}`,
      stroke: p.in_bin === false ? "#D55E00" : "#999999", "stroke-width": 4, opacity: o }, title(p.label + ": " + outcomeWord(p.in_bin))));
  });
  const old = wrap.querySelector("svg.overlay");
  if (old) old.replaceWith(svg); else wrap.appendChild(svg);
  cameraMeta = { time: camera.frame_time, grab: camera.grab_seconds };
  tickCameraAge();
  fallback.replaceChildren(el("div", { id: "room-in-details" }));
  renderRoom(room, document.getElementById("room-in-details"));
}

let cameraMeta = null;
function tickCameraAge() {
  const node = document.getElementById("camera-age");
  if (!node || !cameraMeta || !cameraMeta.time) return;
  node.textContent = `frame ${hms(Date.now() / 1000 - cameraMeta.time)} old` +
    (cameraMeta.grab ? ` · grab ${fmt(cameraMeta.grab, 1)} s` : "") + " · overlay: map projected through the ceiling calibration";
}

// A new frame every ~2 s, swapped in only once loaded so the picture never blanks.
function refreshCameraImage() {
  if (!cameraShown) return;
  const img = document.getElementById("camera-img");
  if (!img) return;
  const next = new Image();
  next.onload = () => { img.src = next.src; };
  next.src = "/api/camera.jpg?t=" + Date.now();
}

function renderRoom(room, body) {
  const X = [-2.05, 2.25], Y = [-2.05, 2.05], W = 520;
  const m = { l: 36, r: 10, t: 10, b: 30 };
  const sc = (W - m.l - m.r) / (X[1] - X[0]);
  const Hh = Math.round((Y[1] - Y[0]) * sc) + m.t + m.b;
  const { svg, sx, sy } = frame({ w: W, h: Hh, m, x: X, y: Y, xticks: [-2, -1, 0, 1, 2], yticks: [-2, -1, 0, 1, 2],
    xlabel: "map x (m)", ylabel: "map y (m)" });
  const [bx0, bx1, by0, by1] = room.drivable_box;
  svg.appendChild(s("rect", { x: sx(bx0), y: sy(by1), width: sx(bx1) - sx(bx0), height: sy(by0) - sy(by1), fill: "none",
    stroke: "var(--ref)", "stroke-dasharray": "4 3" }, title("drivable box (skill server, 2026-10-20)")));
  // The band runs from the robot-side edge across the tape (+y), its thickness measured square to it.
  const a = room.tape_intercept, b = room.tape_slope, th = room.tape_thickness * Math.sqrt(1 + b * b);
  const tape = [[X[0], a + b * X[0]], [X[1], a + b * X[1]], [X[1], a + th + b * X[1]], [X[0], a + th + b * X[0]]];
  svg.appendChild(s("polygon", { points: tape.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" "), fill: "var(--tape)", opacity: 0.85 },
    title(`tape: robot-side edge y = ${a.toFixed(3)} + ${b.toFixed(4)} x, ${room.tape_thickness} m thick`)));
  svg.appendChild(s("text", { x: sx(X[1]) - 4, y: sy(a + b * X[1]) + 14, "text-anchor": "end", class: "muted" },
    `tape  y = ${a.toFixed(3)} + ${b.toFixed(4)} x`));
  const binRect = (spot, style) => {
    const c = Math.cos(spot.yaw), sn = Math.sin(spot.yaw), hl = spot.length / 2, hw = spot.width / 2;
    const corners = [[hl, hw], [-hl, hw], [-hl, -hw], [hl, -hw]].map(([u, v]) => [spot.x + u * c - v * sn, spot.y + u * sn + v * c]);
    return s("polygon", Object.assign({ points: corners.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" ") }, style),
      title(`${spot.name}: (${spot.x.toFixed(2)}, ${spot.y.toFixed(2)}), yaw ${spot.yaw.toFixed(2)}`));
  };
  for (const spot of room.bin_spots) {
    svg.appendChild(binRect(spot, { fill: "var(--grid)", stroke: "var(--muted)", "stroke-width": 1.5 }));
    svg.appendChild(s("text", { x: sx(spot.x), y: sy(spot.y + spot.length / 2) - 6, "text-anchor": "middle" }, spot.name));
  }
  if (room.observed_bin) svg.appendChild(binRect(room.observed_bin, { fill: "none", stroke: "var(--ours)", "stroke-width": 1.5,
    "stroke-dasharray": "3 2" }));
  const obs = room.observation;
  if (obs && obs.robot) {
    const [x, y, yaw] = obs.robot, L = 0.18;
    const p = [[x + L * Math.cos(yaw), y + L * Math.sin(yaw)], [x + L * 0.6 * Math.cos(yaw + 2.4), y + L * 0.6 * Math.sin(yaw + 2.4)],
      [x + L * 0.6 * Math.cos(yaw - 2.4), y + L * 0.6 * Math.sin(yaw - 2.4)]];
    svg.appendChild(s("polygon", { points: p.map(([u, v]) => `${sx(u)},${sy(v)}`).join(" "), fill: "var(--muted)" },
      title(`robot, last observed: (${x.toFixed(2)}, ${y.toFixed(2)}), yaw ${yaw.toFixed(2)}`)));
  }
  if (obs && obs.cube) svg.appendChild(s("rect", { x: sx(obs.cube[0]) - 4, y: sy(obs.cube[1]) - 4, width: 8, height: 8,
    fill: "none", stroke: "var(--fg)", "stroke-width": 1.5 }, title(`cube, last observed: (${obs.cube[0].toFixed(2)}, ${obs.cube[1].toFixed(2)})`)));
  const L = room.landings, k = L.length;
  L.forEach((p, i) => svg.appendChild(outcomeMark(sx(p.x), sy(p.y), p.in_bin, 5,
    `toss ${p.index} (bin ${p.spot || "?"}): landed (${p.x.toFixed(2)}, ${p.y.toFixed(2)}), ${outcomeWord(p.in_bin)}` +
    (p.inside_bin !== null ? `, inside footprint: ${p.inside_bin}` : ""), 0.35 + 0.65 * (i + 1) / k)));
  const inCount = L.filter((p) => p.in_bin === true).length;
  const note = el("div", { class: "note" }, k
    ? `last ${k} landings: ${inCount}/${k} in bin · older ones fainter · grey boxes: the SAME/FAR spots · dashed blue: bin as last observed · triangle: robot`
    : "No landings: pass --skill-calls with the skill server's skill_calls.jsonl to see where tosses land.");
  const legend = el("div", { class: "legend" }, el("span", { class: "in" }, "in bin"), el("span", { class: "out" }, "not in bin"));
  body.replaceChildren(svg, legend, note);
}

function renderTiming(t, competence) {
  const body = document.getElementById("timing-body");
  const table = (rows, caption) => el("table", {}, el("caption", { style: "text-align:left;color:var(--muted);font-size:12px;padding-bottom:4px" }, caption),
    el("thead", {}, el("tr", {}, ["", "n", "median (s)", "mean (s)", "last (s)"].map((h) => el("th", {}, h)))),
    el("tbody", {}, rows.map((r) => el("tr", {}, el("td", {}, r.name), el("td", {}, String(r.n)), el("td", {}, fmt(r.median_s, 1)),
      el("td", {}, fmt(r.mean_s, 1)), el("td", {}, fmt(r.last_s, 1))))));
  const left = el("div", {},
    el("div", { class: "tiles" }, tile("Picks held (practice)", t.pick_label, "PickCube with no skill error"),
      tile("Picks held (skill server)", t.server_pick_label || "—", t.server_pick_label ? "every pick call, evaluation included" : "no skill_calls.jsonl")),
    t.skill_server.length ? table(t.skill_server, "Skill server calls (robot time; evaluation included)") : el("div", { class: "note" }, "No skill_calls.jsonl given: robot-call timings need --skill-calls."),
    table(t.practice, "Practice actions, wall time since the previous event (planning, the person's y, and the skill)"));
  const mini = (name, series) => {
    const xmax = Math.max(1, ...series.map((p) => p.decision));
    const f = frame({ w: 560, h: 170, m: { l: 40, r: 12, t: 22, b: 32 }, x: [0, xmax], y: [0, 1], xticks: niceTicks(0, xmax, 6).filter(Number.isInteger),
      yticks: [0, 0.5, 1], xlabel: "practice decision" });
    f.svg.appendChild(s("text", { x: 40, y: 14 }, `${name}: belief-mean competence` + (series.length ? ` (now ${series[series.length - 1].value.toFixed(2)})` : "")));
    if (series.length > 1) f.svg.appendChild(s("polyline", { fill: "none", stroke: "var(--ours)", "stroke-width": 2,
      points: series.map((p) => `${f.sx(p.decision)},${f.sy(p.value)}`).join(" ") }));
    const last = series[series.length - 1];
    if (last) f.svg.appendChild(s("circle", { cx: f.sx(last.decision), cy: f.sy(last.value), r: 3, fill: "var(--ours)" },
      title(`decision ${last.decision}, cycle ${last.cycle}: ${last.value.toFixed(3)}`)));
    return f.svg;
  };
  const right = el("div", {}, ...Object.entries(competence).map(([k, v]) => mini(k === "MoveToTossLocationAndToss" ? "Toss" : k, v)),
    el("div", { class: "note" }, "From pomdp_decisions.jsonl; the method's own belief, not a measurement."));
  body.replaceChildren(el("div", { class: "two" }, left, right));
}

function renderLog(st) {
  const body = document.getElementById("log-body");
  const notes = (st.notes || []).length
    ? el("div", { class: "note" }, "Events: " + st.notes.map((n) => `${n.event}${n.summary ? " (" + n.summary + ")" : ""}`).join("; ") +
      (st.discarded_lines ? ` · ${st.discarded_lines} interrupted lines discarded by a resume` : ""))
    : null;
  const comp = Object.entries(st.competences || {}).filter(([k]) => !k.startsWith("ask_for")).map(([k, v]) => `${k} ${fmt(v, 2)}`).join(" · ");
  body.replaceChildren(el("div", { class: "note" }, `phase ${st.phase || "—"} · session time ${hms(st.session_seconds)} · robot calls ${hms(st.robot_call_seconds)}` +
      (st.progress ? " · " + st.progress : "") + (comp ? " · competence " + comp : "")),
    notes || "", st.session_tail && st.session_tail.length ? el("pre", {}, st.session_tail.join("\n"))
      : el("div", { class: "note" }, "No robot_session.log in this run directory."));
}

let lastOk = 0;
function render(state) {
  const stamp = document.getElementById("updated");
  document.getElementById("run-dir").textContent = state.run_dir;
  for (const [name, draw] of [["status", () => renderStatus(state.status)], ["eval-curve", () => renderEval(state.eval_curve)],
    ["camera", () => renderCamera(state.camera, state.room)], ["tosses", () => renderTossStrip(state.tosses)],
    ["details", () => { renderTossParams(state.tosses); renderTiming(state.timing, state.competence); renderLog(state.status); }]]) {
    try { draw(); } catch (error) {
      console.error(error);
      const section = document.getElementById(name);
      section.appendChild(el("div", { class: "note" }, "could not draw: " + error.message));
    }
  }
  lastOk = Date.now();
  stamp.className = "meta";
  stamp.textContent = `page read the run at ${state.updated.slice(11, 19)} · polls every ${POLL_MS / 1000} s`;
}
async function poll() {
  let state;
  try {
    const response = await fetch("/api/state", { cache: "no-store" });
    if (!response.ok) throw new Error(response.status + " " + response.statusText);
    state = await response.json();
  } catch (error) {
    const stamp = document.getElementById("updated");
    stamp.className = "meta stale";
    stamp.textContent = `cannot reach the dashboard server (${error.message})` + (lastOk ? ` · last good ${hms((Date.now() - lastOk) / 1000)} ago` : "");
    return;
  }
  render(state);
}
// The server writes the state at page load into the page itself, so the first paint
// needs no round trip.
const INITIAL_STATE = /*INITIAL_STATE*/null;
if (location.hash === "#details") document.querySelector("details.more").open = true;
if (INITIAL_STATE) render(INITIAL_STATE); else poll();
setInterval(poll, POLL_MS);
setInterval(refreshCameraImage, 2000);
setInterval(() => { tickAge(); tickCameraAge(); }, 1000);
</script>
</body>
</html>
