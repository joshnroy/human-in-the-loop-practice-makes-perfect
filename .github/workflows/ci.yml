name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: lint-imports
      # A committed experiment log must link to this repo's own content by relative
      # path, never by URL: `main` is squash-merge only, so merging orphans every SHA
      # a PR pinned, and an orphaned raw URL still returns 200 for months. The same
      # script also checks that each relative link actually resolves, since making a
      # link relative moves that failure mode rather than removing it. A step of
      # `lint` rather than a fourth job -- the check is ~50 ms against ~30 s of runner
      # startup. Logic lives in the script so `tests/scripts/test_check_doc_links.py`
      # can exercise it without GitHub Actions.
      - run: scripts/check_doc_links.sh

  typecheck:
    runs-on: ubuntu-latest
    # KINDER is a required dependency as of 2026-08-14, so every job that imports the
    # package needs the submodules on disk before pip can install them: both `-e` paths
    # below are empty directories in a fresh checkout and pip fails outright.
    env: &kinder_env
      # **CI renders through OSMesa; the workstation stays on EGL.** That divergence is
      # deliberate. `ubuntu-latest` has no EGL driver, so anything that opens a MuJoCo GL
      # context under `MUJOCO_GL=egl` dies with
      # `AttributeError: 'NoneType' object has no attribute 'eglQueryString'`. These two
      # values are kinder-baselines' own CI verbatim -- its `unit-tests` job sets exactly
      # this pair on its Pytest step -- which is the reference implementation for running
      # KINDER headlessly.
      #
      # `PYOPENGL_PLATFORM` is the **empty string**, not `osmesa` and not merely unset:
      # `mujoco/osmesa/__init__.py` sets it to `osmesa` itself when it is falsy, but
      # *raises* if it is already set to anything that is not `osmesa`.
      #
      # No `DISPLAY` here, also matching kinder-baselines. `register_all_environments()`
      # rewrites both variables to `osmesa` when DISPLAY is unset -- which is now exactly
      # what this job wants, so its headless detection agrees with the choice above
      # instead of being suppressed by a display that does not exist. A `DISPLAY: ":0"`
      # was set here while CI wanted EGL, for precisely the opposite reason.
      MUJOCO_GL: "osmesa"
      PYOPENGL_PLATFORM: ""
      # kindergarden fetches ~2 GB of MimicLabs scene assets from Google Drive on
      # `kinder.make()`. This suppresses that *implicit* fetch; the `test` job below
      # instead restores them from a cache and downloads them explicitly on a miss.
      #
      # **This does not mean no test needs them**, which is what this comment used to say.
      # Every simulator-backed Tossing3D test builds a scene and therefore reads them; 23
      # tests failed on a missing `.msh` when the variable was set with nothing to supply
      # them. It is correct in kindergarden's own CI, whose tests do not build these scenes.
      DISABLE_AUTO_DYNAMIC3D_SCENES_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      # Two passes, in this order, because the two conditions catch different bugs and
      # neither subsumes the other.
      #
      # Without the optional `wandb` extra: this is the import path the package
      # guarantees -- `wandb_writer.py` imports wandb lazily and the wandb-backed tests
      # gate on `importlib.util.find_spec`, exactly as `tossing3d` does for KINDER. A
      # regression that made the package need wandb at import or annotation time would
      # only ever be caught here.
      - run: pip install -e ".[dev,tossing3d]" -e reference/kindergarden -e reference/kinder-baselines/kinder-models
      # Both must resolve under `reference/`, so the tree that is read is the tree that
      # is run. A skew between two checkouts at different commits has already caused a
      # wrong SHA to be stated as fact.
      - name: Verify KINDER resolves under reference/
        run: |
          python - <<'PY'
          import pathlib, kinder, kinder_models
          root = pathlib.Path.cwd() / "reference"
          for mod in (kinder, kinder_models):
              path = pathlib.Path(mod.__file__).resolve()
              assert root in path.parents, f"{mod.__name__} resolves to {path}, not under {root}"
              print(f"{mod.__name__}: {path}")
          PY
      - run: mypy src
      # With it: `ignore_missing_imports = true` means that with no wandb package to
      # read, `wandb.init` is `Any` and *every* argument to it type-checks. So the pass
      # above cannot see a single mismatch against W&B's real signatures, and
      # `wandb_writer.py` was effectively untypechecked on CI. Measured on 04717d6: a
      # tree with a real `wandb.init` type error reported 1 error with wandb importable
      # and 0 without, while CI's typecheck job reported success -- the error PR #211
      # then fixed. Sequential steps in this one job rather than a build matrix: two
      # extra lines against a new job name plus a second ~30 s runner startup and a
      # second full install, for a job that already runs in under two minutes. Order
      # matters and is not arbitrary -- installing the extra is additive, so the
      # wandb-free condition can only be tested before it, never after.
      - run: pip install -e ".[dev,tossing3d,wandb]" -e reference/kindergarden -e reference/kinder-baselines/kinder-models
      - run: mypy src

  test-unit:
    name: "test / unit & core"
    runs-on: ubuntu-latest
    env: *kinder_env
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Cache Fast Downward
        id: cache-fd
        uses: actions/cache@v4
        with:
          path: downward
          key: fast-downward-${{ runner.os }}-release-v1
      - name: Build Fast Downward
        if: steps.cache-fd.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/aibasel/downward.git
          cd downward && ./build.py
      - run: pip install -e ".[dev,tossing3d]" -e reference/kindergarden -e reference/kinder-baselines/kinder-models
      - name: Pytest — Unit & Core tests
        run: |
          pytest -q \
            tests/core \
            tests/planning \
            tests/recording \
            tests/results_writer \
            tests/analysis \
            tests/environments/ballring \
            tests/environments/lightswitch \
            tests/methods \
            tests/humans \
            tests/test_*.py
        env:
          FD_EXEC_PATH: ${{ github.workspace }}/downward

  test-tossingroom:
    name: "test / tossingroom (2D physics)"
    runs-on: ubuntu-latest
    env: *kinder_env
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Cache Fast Downward
        id: cache-fd
        uses: actions/cache@v4
        with:
          path: downward
          key: fast-downward-${{ runner.os }}-release-v1
      - name: Build Fast Downward
        if: steps.cache-fd.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/aibasel/downward.git
          cd downward && ./build.py
      - run: pip install -e ".[dev,tossing3d]" -e reference/kindergarden -e reference/kinder-baselines/kinder-models
      - name: Pytest — TossingRoom
        run: |
          pytest -q \
            tests/environments/tossingroom \
            tests/environments/test_noop_action.py \
            tests/environments/test_operator_dynamics_fidelity.py
        env:
          FD_EXEC_PATH: ${{ github.workspace }}/downward

  test-tossing3d:
    name: "test / tossing3d (MuJoCo/OSMesa)"
    runs-on: ubuntu-latest
    env: *kinder_env
    steps:
      - name: Install LAPACK BLAS, and OSMESA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends liblapack-dev libblas-dev libosmesa6-dev libgl1 libglx-mesa0
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Cache Fast Downward
        id: cache-fd
        uses: actions/cache@v4
        with:
          path: downward
          key: fast-downward-${{ runner.os }}-release-v1
      - name: Build Fast Downward
        if: steps.cache-fd.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/aibasel/downward.git
          cd downward && ./build.py
      - name: Resolve the kindergarden pin
        id: kinder-pin
        run: echo "sha=$(git rev-parse HEAD:reference/kindergarden)" >> "$GITHUB_OUTPUT"
      - name: Cache MimicLabs scene assets
        id: cache-assets
        uses: actions/cache@v4
        with:
          path: reference/kindergarden/src/kinder/envs/dynamic3d/models/assets/mimiclabs_scenes
          key: mimiclabs-scenes-${{ runner.os }}-${{ steps.kinder-pin.outputs.sha }}
      - run: pip install -e ".[dev,tossing3d]" -e reference/kindergarden -e reference/kinder-baselines/kinder-models
      - name: Download MimicLabs scene assets
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: python -c "from kinder.utils import download_mimiclabs_assets as d; d(non_interactive=True)"
      - name: Verify KINDER resolves under reference/
        run: |
          python - <<'PY'
          import pathlib, kinder, kinder_models
          root = pathlib.Path.cwd() / "reference"
          for mod in (kinder, kinder_models):
              path = pathlib.Path(mod.__file__).resolve()
              assert root in path.parents, f"{mod.__name__} resolves to {path}, not under {root}"
              print(f"{mod.__name__}: {path}")
          PY
      - name: Pytest — Tossing3D (loads MuJoCo/OSMesa; own process)
        run: pytest -q tests/environments/tossing3d
        env:
          FD_EXEC_PATH: ${{ github.workspace }}/downward

  test-scripts:
    name: "test / scripts & reproducibility"
    runs-on: ubuntu-latest
    env: *kinder_env
    steps:
      - name: Install LAPACK BLAS, and OSMESA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends liblapack-dev libblas-dev libosmesa6-dev libgl1 libglx-mesa0
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Cache Fast Downward
        id: cache-fd
        uses: actions/cache@v4
        with:
          path: downward
          key: fast-downward-${{ runner.os }}-release-v1
      - name: Build Fast Downward
        if: steps.cache-fd.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/aibasel/downward.git
          cd downward && ./build.py
      - name: Resolve the kindergarden pin
        id: kinder-pin
        run: echo "sha=$(git rev-parse HEAD:reference/kindergarden)" >> "$GITHUB_OUTPUT"
      - name: Cache MimicLabs scene assets
        id: cache-assets
        uses: actions/cache@v4
        with:
          path: reference/kindergarden/src/kinder/envs/dynamic3d/models/assets/mimiclabs_scenes
          key: mimiclabs-scenes-${{ runner.os }}-${{ steps.kinder-pin.outputs.sha }}
      - run: pip install -e ".[dev,tossing3d]" -e reference/kindergarden -e reference/kinder-baselines/kinder-models
      - name: Download MimicLabs scene assets
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: python -c "from kinder.utils import download_mimiclabs_assets as d; d(non_interactive=True)"
      - name: Verify KINDER resolves under reference/
        run: |
          python - <<'PY'
          import pathlib, kinder, kinder_models
          root = pathlib.Path.cwd() / "reference"
          for mod in (kinder, kinder_models):
              path = pathlib.Path(mod.__file__).resolve()
              assert root in path.parents, f"{mod.__name__} resolves to {path}, not under {root}"
              print(f"{mod.__name__}: {path}")
          PY
      - name: Pytest — Scripts & Reproducibility
        run: pytest -q tests/scripts
        env:
          FD_EXEC_PATH: ${{ github.workspace }}/downward
