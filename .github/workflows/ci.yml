name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels that PR's in-progress run; a burst of force-pushes
# once queued ~15 full runs, all but the newest wasted. A push to main is never cancelled:
# each gets a group of its own (`run_id`), because GitHub replaces a *pending* run in a
# shared group with the newer one even when `cancel-in-progress` is false
# (tests/test_ci_run_scope.py).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Every pytest call passes `-m "$PYTEST_MARK_EXPR"`. A pull request skips the slow
  # tests marked `main_only`; any other event (today only a push to main) gets the empty
  # string, which pytest treats as no filter, so main still runs everything. A local bare
  # `pytest` passes no `-m` and also runs everything (tests/test_main_only_marker.py).
  PYTEST_MARK_EXPR: ${{ github.event_name == 'pull_request' && 'not main_only' || '' }}

jobs:
  # Whether `test / tossing3d` must run. Always `true` outside a pull request, so a push to
  # main runs it unconditionally. On a pull request it is `true` iff the diff touches
  # something the Tossing3D/SweepOffShelf3D tests import or read: the list below is checked
  # against those tests' real import closure by tests/test_ci_run_scope.py, so it is
  # deliberately broad -- cli.py registers every environment and method, which pulls nearly
  # all of src/ in. Uses the PR files API, so no checkout.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tossing3d: ${{ github.event_name != 'pull_request' || steps.filter.outputs.tossing3d }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            tossing3d:
              - '.github/**'
              - 'pyproject.toml'
              - '.gitmodules'
              - 'reference/**'
              - '**/conftest.py'
              - 'src/hitl_pmp/*.py'
              - 'src/hitl_pmp/core/**'
              - 'src/hitl_pmp/environments/**'
              - 'src/hitl_pmp/humans/**'
              - 'src/hitl_pmp/methods/**'
              - 'src/hitl_pmp/planning/**'
              - 'src/hitl_pmp/presets/**'
              - 'src/hitl_pmp/recording/**'
              - 'src/hitl_pmp/results_writer/**'
              - 'src/hitl_pmp/agentic_runtime/__init__.py'
              - 'src/hitl_pmp/agentic_runtime/observations.py'
              - 'src/hitl_pmp/full_agentic/__init__.py'
              - 'src/hitl_pmp/full_agentic/domains.py'
              - 'scripts/__init__.py'
              - 'scripts/run_sweep.py'
              - 'scripts/sweepoffshelf3d_launch.py'
              - 'scripts/tossing3d_layout_demo.py'
              - 'tests/__init__.py'
              - 'tests/environments/__init__.py'
              - 'tests/mimiclabs_assets.py'
              - 'tests/environments/tossing3d/**'
              - 'tests/environments/sweepoffshelf3d/**'
              - 'configs/**'
              - 'benchmarks/**'
              - 'docs/**/*.json'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Pip is saved only from main; pull requests restore it. Each PR saving its own
      # ~3.5 GB pip cache overflowed the cache quota and evicted the MimicLabs scenes,
      # whose re-download Google Drive then rate-limited (tests/test_ci_caches.py).
      - name: Restore pip cache
        if: github.event_name != 'push'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Cache pip (saved from main only)
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Cache ruff
        uses: actions/cache@v4
        with:
          path: .ruff_cache
          key: ruff-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ruff-${{ runner.os }}-
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: lint-imports
      # A committed experiment log must link to this repo's own content by relative
      # path, never by URL: `main` is squash-merge only, so merging orphans every SHA
      # a PR pinned, and an orphaned raw URL still returns 200 for months. The same
      # script also checks that each relative link actually resolves, since making a
      # link relative moves that failure mode rather than removing it. A step of
      # `lint` rather than a fourth job -- the check is ~50 ms against ~30 s of runner
      # startup. Logic lives in the script so `tests/scripts/test_check_doc_links.py`
      # can exercise it without GitHub Actions.
      - run: scripts/check_doc_links.sh

  typecheck:
    runs-on: ubuntu-latest
    # KINDER is a required dependency as of 2026-08-14, so every job that imports the
    # package needs the submodules on disk before pip can install them: both `-e` paths
    # below are empty directories in a fresh checkout and pip fails outright.
    env: &kinder_env
      # **CI renders through OSMesa; the workstation stays on EGL.** That divergence is
      # deliberate. `ubuntu-latest` has no EGL driver, so anything that opens a MuJoCo GL
      # context under `MUJOCO_GL=egl` dies with
      # `AttributeError: 'NoneType' object has no attribute 'eglQueryString'`. These two
      # values are kinder-baselines' own CI verbatim -- its `unit-tests` job sets exactly
      # this pair on its Pytest step -- which is the reference implementation for running
      # KINDER headlessly.
      #
      # `PYOPENGL_PLATFORM` is the **empty string**, not `osmesa` and not merely unset:
      # `mujoco/osmesa/__init__.py` sets it to `osmesa` itself when it is falsy, but
      # *raises* if it is already set to anything that is not `osmesa`.
      #
      # No `DISPLAY` here, also matching kinder-baselines. `register_all_environments()`
      # rewrites both variables to `osmesa` when DISPLAY is unset -- which is now exactly
      # what this job wants, so its headless detection agrees with the choice above
      # instead of being suppressed by a display that does not exist. A `DISPLAY: ":0"`
      # was set here while CI wanted EGL, for precisely the opposite reason.
      MUJOCO_GL: "osmesa"
      PYOPENGL_PLATFORM: ""
      # kindergarden fetches ~2 GB of MimicLabs scene assets from Google Drive on
      # `kinder.make()`. This suppresses that *implicit* fetch; the `test` job below
      # instead restores them from a cache and downloads them explicitly on a miss.
      #
      # **This does not mean no test needs them**, which is what this comment used to say.
      # Every simulator-backed Tossing3D test builds a scene and therefore reads them; 23
      # tests failed on a missing `.msh` when the variable was set with nothing to supply
      # them. It is correct in kindergarden's own CI, whose tests do not build these scenes.
      DISABLE_AUTO_DYNAMIC3D_SCENES_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Restore pip cache
        if: github.event_name != 'push'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Cache pip (saved from main only)
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('src/**/*.py', 'pyproject.toml') }}
          restore-keys: |
            mypy-${{ runner.os }}-
      # Two passes, in this order, because the two conditions catch different bugs and
      # neither subsumes the other.
      #
      # Without the optional `wandb` extra: this is the import path the package
      # guarantees -- `wandb_writer.py` imports wandb lazily and the wandb-backed tests
      # gate on `importlib.util.find_spec`, exactly as `tossing3d` does for KINDER. A
      # regression that made the package need wandb at import or annotation time would
      # only ever be caught here.
      - run: pip install -e ".[dev,tossing3d]" -e reference/kindergarden -e reference/kinder-baselines/kinder-models
      # Both must resolve under `reference/`, so the tree that is read is the tree that
      # is run. A skew between two checkouts at different commits has already caused a
      # wrong SHA to be stated as fact.
      - name: Verify KINDER resolves under reference/
        run: |
          python - <<'PY'
          import pathlib, kinder, kinder_models
          root = pathlib.Path.cwd() / "reference"
          for mod in (kinder, kinder_models):
              path = pathlib.Path(mod.__file__).resolve()
              assert root in path.parents, f"{mod.__name__} resolves to {path}, not under {root}"
              print(f"{mod.__name__}: {path}")
          PY
      - run: mypy src
      # With it: `ignore_missing_imports = true` means that with no wandb package to
      # read, `wandb.init` is `Any` and *every* argument to it type-checks. So the pass
      # above cannot see a single mismatch against W&B's real signatures, and
      # `wandb_writer.py` was effectively untypechecked on CI. Measured on 04717d6: a
      # tree with a real `wandb.init` type error reported 1 error with wandb importable
      # and 0 without, while CI's typecheck job reported success -- the error PR #211
      # then fixed. Sequential steps in this one job rather than a build matrix: two
      # extra lines against a new job name plus a second ~30 s runner startup and a
      # second full install, for a job that already runs in under two minutes. Order
      # matters and is not arbitrary -- installing the extra is additive, so the
      # wandb-free condition can only be tested before it, never after.
      - run: pip install -e ".[dev,tossing3d,wandb]" -e reference/kindergarden -e reference/kinder-baselines/kinder-models
      - run: mypy src

  test-unit:
    name: "test / unit & core"
    runs-on: ubuntu-latest
    env: *kinder_env
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Restore pip cache
        if: github.event_name != 'push'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Cache pip (saved from main only)
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Cache Fast Downward
        id: cache-fd
        uses: actions/cache@v4
        with:
          path: downward
          key: fast-downward-${{ runner.os }}-release-v1
      - name: Build Fast Downward
        if: steps.cache-fd.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/aibasel/downward.git
          cd downward && ./build.py
      - name: Cache pytest cache
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: pytest-${{ runner.os }}-${{ hashFiles('tests/**', 'src/**') }}
          restore-keys: |
            pytest-${{ runner.os }}-
      - run: pip install -e ".[dev,tossing3d]" -e reference/kindergarden -e reference/kinder-baselines/kinder-models
      - name: Pytest — Unit & Core tests (MSS)
        run: |
          pytest -q -n auto --dist loadgroup --durations=25 -m "$PYTEST_MARK_EXPR" \
            tests/core \
            tests/planning \
            tests/recording \
            tests/results_writer \
            tests/environments/ballring \
            tests/environments/lightswitch \
            tests/environments/tossing3d/real \
            tests/methods \
            tests/humans \
            tests/presets \
            tests/test_*.py
        env:
          FD_EXEC_PATH: ${{ github.workspace }}/downward

  test-analysis:
    name: "test / historical analysis (main only)"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env: *kinder_env
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Restore pip cache
        if: github.event_name != 'push'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Cache pip (saved from main only)
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Cache Fast Downward
        id: cache-fd
        uses: actions/cache@v4
        with:
          path: downward
          key: fast-downward-${{ runner.os }}-release-v1
      - name: Build Fast Downward
        if: steps.cache-fd.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/aibasel/downward.git
          cd downward && ./build.py
      - name: Cache pytest cache
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: pytest-${{ runner.os }}-analysis-${{ hashFiles('tests/**', 'src/**') }}
          restore-keys: |
            pytest-${{ runner.os }}-analysis-
      - run: pip install -e ".[dev,tossing3d]" -e reference/kindergarden -e reference/kinder-baselines/kinder-models
      - name: Pytest — Historical Analysis tests
        run: pytest -q -n auto --dist loadgroup --durations=25 -m "$PYTEST_MARK_EXPR" tests/analysis
        env:
          FD_EXEC_PATH: ${{ github.workspace }}/downward

  test-tossingroom:
    name: "test / tossingroom (2D physics)"
    runs-on: ubuntu-latest
    env: *kinder_env
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Restore pip cache
        if: github.event_name != 'push'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Cache pip (saved from main only)
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Cache Fast Downward
        id: cache-fd
        uses: actions/cache@v4
        with:
          path: downward
          key: fast-downward-${{ runner.os }}-release-v1
      - name: Build Fast Downward
        if: steps.cache-fd.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/aibasel/downward.git
          cd downward && ./build.py
      - name: Cache pytest cache
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: pytest-${{ runner.os }}-${{ hashFiles('tests/**', 'src/**') }}
          restore-keys: |
            pytest-${{ runner.os }}-
      - run: pip install -e ".[dev,tossing3d]" -e reference/kindergarden -e reference/kinder-baselines/kinder-models
      - name: Pytest — TossingRoom
        run: |
          pytest -q -n auto --dist loadgroup --durations=25 -m "$PYTEST_MARK_EXPR" \
            tests/environments/tossingroom \
            tests/environments/test_noop_action.py \
            tests/environments/test_operator_dynamics_fidelity.py \
            tests/environments/test_sampled_start_reset.py
        env:
          FD_EXEC_PATH: ${{ github.workspace }}/downward

  test-tossing3d:
    name: "test / tossing3d (MuJoCo/OSMesa)"
    needs: changes
    # Skipped only on a pull request whose diff the `changes` filter says cannot affect it.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.tossing3d == 'true') }}
    runs-on: ubuntu-latest
    env: *kinder_env
    steps:
      - name: Install LAPACK, BLAS, and OSMesa
        run: |
          # Resolve against this runner image; cached .deb files can require
          # exact library versions that have changed on ubuntu-latest.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends liblapack-dev libblas-dev libosmesa6-dev libgl1 libglx-mesa0
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Restore pip cache
        if: github.event_name != 'push'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Cache pip (saved from main only)
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Cache Fast Downward
        id: cache-fd
        uses: actions/cache@v4
        with:
          path: downward
          key: fast-downward-${{ runner.os }}-release-v1
      - name: Build Fast Downward
        if: steps.cache-fd.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/aibasel/downward.git
          cd downward && ./build.py
      - name: Resolve the kindergarden pin
        id: kinder-pin
        run: echo "sha=$(git rev-parse HEAD:reference/kindergarden)" >> "$GITHUB_OUTPUT"
      - name: Cache MimicLabs scene assets
        id: cache-assets
        uses: actions/cache@v4
        with:
          path: reference/kindergarden/src/kinder/envs/dynamic3d/models/assets/mimiclabs_scenes
          key: mimiclabs-scenes-${{ runner.os }}-${{ steps.kinder-pin.outputs.sha }}
      - name: Cache pytest cache
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: pytest-${{ runner.os }}-${{ hashFiles('tests/**', 'src/**') }}
          restore-keys: |
            pytest-${{ runner.os }}-
      - run: pip install -e ".[dev,tossing3d]" -e reference/kindergarden -e reference/kinder-baselines/kinder-models
      # On a miss, fill from this repo's checksummed mirror of the lab2 scene (~22 MB,
      # every file lab2.xml loads), never KINDER's ~2 GB Google Drive download, which
      # rate-limits CI runners. Only lab2 is used (tests/test_ci_caches.py).
      - name: Fetch MimicLabs lab2 scene assets from the release mirror
        if: steps.cache-assets.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download mimiclabs-lab2-v1 -p mimiclabs-lab2-v1.tar.gz -D "$RUNNER_TEMP"
          echo "f1185bfde2a1ff09fff3b1f7372de0fe8ec61ce27546cdfca47c77524110d4a0  $RUNNER_TEMP/mimiclabs-lab2-v1.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mimiclabs-lab2-v1.tar.gz" -C reference/kindergarden/src/kinder/envs/dynamic3d/models/assets/mimiclabs_scenes
      - name: Verify KINDER resolves under reference/
        run: |
          python - <<'PY'
          import pathlib, kinder, kinder_models
          root = pathlib.Path.cwd() / "reference"
          for mod in (kinder, kinder_models):
              path = pathlib.Path(mod.__file__).resolve()
              assert root in path.parents, f"{mod.__name__} resolves to {path}, not under {root}"
              print(f"{mod.__name__}: {path}")
          PY
      # `-n auto` (pytest-xdist, one worker per vCPU) does not reopen the LLVM collision
      # this job exists to avoid: workers only ever draw tests from this job's own path, so
      # no worker process mixes OSMesa with torch's triton any more than the serial run
      # did. `--dist loadgroup` keeps each `xdist_group`-marked module on one worker, so a
      # module-scoped fixture is built once rather than once per worker that receives one
      # of its tests (tests/test_xdist_groups.py). Every pytest call carries
      # `--durations=25` so the slowest tests stay visible in the log.
      # SweepOffShelf3D is also a KINDER Dynamic3D scene (lab2), so its simulator tests need
      # this job's OSMesa rendering too; no other job collects them (tests/test_ci_coverage.py).
      # The real-robot domain (`tossing3d/real`) imports no MuJoCo but runs whole practice
      # cycles in-process, and the first torch optimizer a learning update builds imports
      # triton: in a worker an earlier simulator test loaded OSMesa into, that segfaults,
      # and the crashed worker then stalls the run until the 6-hour limit. Those tests run
      # in `test / unit & core` instead.
      - name: Pytest — Tossing3D and SweepOffShelf3D (load MuJoCo/OSMesa; own processes)
        run: pytest -q -n auto --dist loadgroup --durations=25 -m "$PYTEST_MARK_EXPR" tests/environments/tossing3d tests/environments/sweepoffshelf3d --ignore=tests/environments/tossing3d/real
        env:
          FD_EXEC_PATH: ${{ github.workspace }}/downward

  test-scripts:
    name: "test / scripts & reproducibility"
    runs-on: ubuntu-latest
    env: *kinder_env
    steps:
      - name: Install LAPACK, BLAS, and OSMesa
        run: |
          # Resolve against this runner image; cached .deb files can require
          # exact library versions that have changed on ubuntu-latest.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends liblapack-dev libblas-dev libosmesa6-dev libgl1 libglx-mesa0
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Restore pip cache
        if: github.event_name != 'push'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Cache pip (saved from main only)
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Cache Fast Downward
        id: cache-fd
        uses: actions/cache@v4
        with:
          path: downward
          key: fast-downward-${{ runner.os }}-release-v1
      - name: Build Fast Downward
        if: steps.cache-fd.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/aibasel/downward.git
          cd downward && ./build.py
      - name: Resolve the kindergarden pin
        id: kinder-pin
        run: echo "sha=$(git rev-parse HEAD:reference/kindergarden)" >> "$GITHUB_OUTPUT"
      - name: Cache MimicLabs scene assets
        id: cache-assets
        uses: actions/cache@v4
        with:
          path: reference/kindergarden/src/kinder/envs/dynamic3d/models/assets/mimiclabs_scenes
          key: mimiclabs-scenes-${{ runner.os }}-${{ steps.kinder-pin.outputs.sha }}
      - name: Cache pytest cache
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: pytest-${{ runner.os }}-${{ hashFiles('tests/**', 'src/**') }}
          restore-keys: |
            pytest-${{ runner.os }}-
      - run: pip install -e ".[dev,tossing3d]" -e reference/kindergarden -e reference/kinder-baselines/kinder-models
      # On a miss, fill from this repo's checksummed mirror of the lab2 scene (~22 MB,
      # every file lab2.xml loads), never KINDER's ~2 GB Google Drive download, which
      # rate-limits CI runners. Only lab2 is used (tests/test_ci_caches.py).
      - name: Fetch MimicLabs lab2 scene assets from the release mirror
        if: steps.cache-assets.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download mimiclabs-lab2-v1 -p mimiclabs-lab2-v1.tar.gz -D "$RUNNER_TEMP"
          echo "f1185bfde2a1ff09fff3b1f7372de0fe8ec61ce27546cdfca47c77524110d4a0  $RUNNER_TEMP/mimiclabs-lab2-v1.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mimiclabs-lab2-v1.tar.gz" -C reference/kindergarden/src/kinder/envs/dynamic3d/models/assets/mimiclabs_scenes
      - name: Verify KINDER resolves under reference/
        run: |
          python - <<'PY'
          import pathlib, kinder, kinder_models
          root = pathlib.Path.cwd() / "reference"
          for mod in (kinder, kinder_models):
              path = pathlib.Path(mod.__file__).resolve()
              assert root in path.parents, f"{mod.__name__} resolves to {path}, not under {root}"
              print(f"{mod.__name__}: {path}")
          PY
      - name: Pytest — Scripts & Reproducibility
        run: pytest -q -n auto --dist loadgroup --durations=25 -m "$PYTEST_MARK_EXPR" tests/scripts
        env:
          FD_EXEC_PATH: ${{ github.workspace }}/downward

  test:
    name: "test"
    needs: [changes, test-unit, test-tossingroom, test-tossing3d, test-scripts]
    # The required status check. It decides from its dependencies' results itself rather
    # than by default `needs` semantics: a job whose dependency fails is *skipped*, and
    # GitHub counts a skipped required check as passing. The one skip it accepts is
    # `test / tossing3d` on a pull request the `changes` filter cleared.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check every test job passed or was intentionally skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          cleared = (
              os.environ["EVENT"] == "pull_request"
              and needs["changes"]["result"] == "success"
              and needs["changes"]["outputs"].get("tossing3d") == "false"
          )
          bad = {
              job: need["result"]
              for job, need in needs.items()
              if need["result"] != "success"
              and not (job == "test-tossing3d" and need["result"] == "skipped" and cleared)
          }
          for job, need in needs.items():
              print(f"{job}: {need['result']}")
          if bad:
              sys.exit(f"not passed: {bad}")
          print("tossing3d skipped: no affected paths" if cleared else "all test jobs passed")
          PY
