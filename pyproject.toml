[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hitl-pmp"
version = "0.1.0"
description = "Human-in-the-Loop: Practice Makes Perfect"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "gymnasium",
    "matplotlib",
    "imageio[ffmpeg]",
    "imageio-ffmpeg",
    "torch",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "import-linter",
]
# KINDER, the upstream benchmark `environments/tossing3d/` drives.
#
# *Optional*, not a core dependency: it pulls MuJoCo, PyBullet and OpenCV, which
# nothing else here needs, and it caps `requires-python` at `<3.13` while this project
# sets no upper bound. `tossing3d/kinder_backend.py` imports it lazily on purpose, so
# the whole package still imports, typechecks and tests without it -- CI never installs
# this group, and `tests/environments/tossing3d/conftest.py`'s `kinder_available` skips
# the eight simulator tests when `kinder` is absent.
#
# *Pinned to exact commits*, not to a branch, because KINDER is a live upstream that
# moves under this port: the leaked PyBullet client `KinderBackend._release` works
# around is an upstream bug, so a version that fixes or reshapes it would silently
# change what the numbers in `docs/experiment-logs/2026-08-04-tossing3d-ees.md` mean.
#
# These SHAs are *inferred*, not recorded -- nothing wrote down the KINDER commit the
# port was actually built on. 39eb7e0 was upstream `main` continuously from 2026-07-28
# until 2026-08-04 12:09 UTC, which covers the port's first commit (2026-08-04 03:08
# UTC) but not the EES sweep (15:37 UTC), by which point cdf1b8b had landed. So timing
# alone does not exclude the sweep having run against cdf1b8b; it is ruled out on
# content instead -- cdf1b8b changes cluttered-retrieval initial-state sampling, which
# Tossing3D does not use. `kinder-baselines` has not moved since 2026-06-29, so
# 4c731dc8 is unambiguous.
#
# `kinder_models` holds the parameterized controllers the port actually drives
# (`dynamic3d.shelf`, `dynamic3d.tossing`); they live in the `kinder-baselines`
# monorepo, not in `kindergarden`, so both are needed.
#
# Install these into the *separate* KINDER virtualenv described in
# `src/hitl_pmp/environments/tossing3d/README.md`, not on top of the `hitl-pmp` env.
tossing3d = [
    "kindergarden @ git+https://github.com/Princeton-Robot-Planning-and-Learning/kindergarden.git@39eb7e084c1d54a69f71abfd7faebef62e4a059e",
    "kinder_models @ git+https://github.com/Princeton-Robot-Planning-and-Learning/kinder-baselines.git@4c731dc81d68ee6888ef3a989034991cd0694630#subdirectory=kinder-models",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/hitl_pmp"]

[tool.coverage.report]
exclude_lines = [
    # Abstract-method bodies never execute regardless of test quality -- the whole
    # point is that a concrete subclass overrides them instead.
    "raise NotImplementedError",
    # pytest imports modules rather than running them as __main__, so a script's
    # entrypoint guard is never exercised under test regardless of how well its
    # own main()/parse_args() are covered.
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
preview = true

[tool.ruff.lint]
# N999 bans non-lower_case.py module/file names.
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "PLR0917", "N999"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"dataclasses".msg = "Dataclasses are banned in this project — use a pydantic BaseModel instead."
"attr".msg = "Use a pydantic BaseModel instead of attrs in this project."
"attrs".msg = "Use a pydantic BaseModel instead of attrs in this project."
"typing.TYPE_CHECKING".msg = "if TYPE_CHECKING guards are banned — import the target's types.py directly instead of its ABC file, which avoids the cycle without deferring the import."

[tool.ruff.lint.pylint]
# Every parameter (beyond self/cls) must be keyword-only — this makes any
# positional-or-keyword parameter in a function we define a lint error.
max-positional-args = 0

[tool.mypy]
python_version = "3.10"
packages = ["hitl_pmp"]
ignore_missing_imports = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.importlinter]
root_packages = ["hitl_pmp"]

# Encodes core/README.md's dependency direction as an enforced contract, not just
# prose: core/ is the foundation nothing else may be imported by; practice_loop.py/
# humans/planning/adapters depend only on core and are mutually independent (nothing
# in any of the four currently imports another); method_runner.py sits above those
# (it drives practice_loop.py); environments/ sits above that (environments/<domain>/
# cli.py drives method_runner.py); methods/ sits above environments/ (a Method like
# SkillOracleMethod imports the domain it wraps); and hitl_pmp/cli.py is the true
# top, the only thing allowed to import both environments/ and methods/ directly.
# This is the exact rule a manual review missed once already (SkillOracleMethod
# briefly lived inside environments/lightswitch/ before being moved to
# methods/oracle/) -- see methods/README.md's "oracle/" section.
[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "hitl_pmp.cli",
    "hitl_pmp.methods",
    "hitl_pmp.environments",
    "hitl_pmp.cli_protocols",
    "hitl_pmp.method_runner",
    "hitl_pmp.practice_loop | hitl_pmp.humans | hitl_pmp.planning | hitl_pmp.adapters",
    "hitl_pmp.core",
]
