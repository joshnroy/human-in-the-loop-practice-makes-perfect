[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hitl-pmp"
version = "0.1.0"
description = "Human-in-the-Loop: Practice Makes Perfect"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "gymnasium",
    "matplotlib",
    "imageio[ffmpeg]",
    "imageio-ffmpeg",
    # Already present transitively (imageio and matplotlib both require it), but
    # recording/overlay.py imports it directly to draw the status bar, so it is
    # declared rather than assumed.
    "pillow",
    "torch",
    "stonesoup>=1.7,<2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "import-linter",
    # `analysis/` only, never `src/hitl_pmp` -- which is why this is a dev dependency
    # rather than a main one: the library itself does not import scipy, and a consumer
    # installing `hitl-pmp` should not pay for it. `dev` is exactly the set of
    # environments that run `analysis/` and its tests, and CI already installs
    # `.[dev]` in all three jobs, so this needs no CI change.
    #
    # Unlike `wandb` and KINDER, scipy is deliberately NOT an optional extra gated on
    # `importlib.util.find_spec`. The reason it was added is that `hitl-pmp` had no
    # scipy while the KINDER venv had 1.14.0, so the same repository gave different
    # statistical resolution depending on which interpreter an agent ran in. An
    # optional scipy would preserve exactly that split.
    #
    # Unpinned on purpose, but note the one real constraint: `pybullet_helpers` pins
    # `scipy==1.14.0` exactly, so any environment that also installs KINDER is held at
    # 1.14.0. Pinning a floor above that here would make the two uninstallable together.
    "scipy",
]
# --record-wandb only. Optional, and CI deliberately does not install it: the package
# must import, typecheck and test without wandb present, exactly as it must without
# KINDER. results_writer/wandb_writer.py imports it lazily and the wandb-backed tests
# gate on importlib.util.find_spec("wandb"), so a machine without it skips rather than
# fails.
wandb = ["wandb"]
# `--env tossing3d` only: KINDER's `Tossing3D` simulator and its parameterized
# controllers.
#
# ## This installs into `hitl-pmp` itself, and used not to
#
# KINDER lived in a separate `kinder-venv` virtualenv, on the stated grounds that the
# two environments "cannot be merged" because `kindergarden` caps `requires-python` at
# `<3.13`. **That was a misdiagnosis**: both environments were already Python 3.10.20,
# so that cap excluded neither. The real constraint is three version ceilings, and
# `hitl-pmp` runs its full gate unchanged under all of them -- so there is no reason for
# a second interpreter, and the split cost real coverage (see below).
#
# The ceilings, all transitive through `kindergarden`, none of them ours to lift:
#   * `pybullet_helpers 0.1.1` -> `numpy<2.0,>=1.23.5`, resolving to 1.26.4
#   * `pybullet_helpers 0.1.1` -> `scipy==1.14.0`, an EXACT pin
#   * `moviepy` -> `pillow<12.0`, resolving to 11.3.0
# Installing this extra therefore DOWNGRADES numpy, scipy and pillow in whatever
# environment it is applied to. That is expected and was measured to be safe here; it is
# also why this is an extra rather than a main dependency.
#
# ## Why the two local packages are not listed here
#
# `kindergarden` and `kinder_models` are git submodules under `reference/`, not PyPI
# distributions, and PEP 508 direct references would have to hardcode an absolute
# `file://` path. So this extra declares only the ceilings, and the two packages are
# installed alongside it (see CLAUDE.md):
#
#     pip install -e ".[dev,tossing3d]" \
#         -e reference/kindergarden -e reference/kinder-baselines/kinder-models
#
# Listing the ceilings here anyway is what stops a later `pip install -U numpy` from
# silently breaking a working simulator env: pip has a declared constraint to refuse.
#
# ## CI deliberately does not install this
#
# Exactly as with `wandb`. CI installing MuJoCo, PyBullet and ~1-2 GB of MimicLabs scene
# assets is what the current design avoids on purpose. `environments/tossing3d/` imports
# KINDER lazily from one module and its tests gate on
# `importlib.util.find_spec("kinder")` -- the IMPORT package name; the distribution is
# `kindergarden` -- so a machine without it skips rather than fails. Unification improves
# LOCAL coverage only: the simulator-backed fidelity tests now run in the normal gate
# instead of being skipped by everyone who never created the second venv, which is how
# a stale test survived a skill signature change unnoticed. Please do not "finish" this
# by wiring KINDER into CI.
tossing3d = [
    "numpy<2.0,>=1.23.5",
    "scipy==1.14.0",
    "pillow<12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/hitl_pmp"]

[tool.coverage.report]
exclude_lines = [
    # Abstract-method bodies never execute regardless of test quality -- the whole
    # point is that a concrete subclass overrides them instead.
    "raise NotImplementedError",
    # pytest imports modules rather than running them as __main__, so a script's
    # entrypoint guard is never exercised under test regardless of how well its
    # own main()/parse_args() are covered.
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
preview = true
# `reference/` holds third-party checkouts as git submodules. Once they are populated,
# `ruff check .` walks 830 files of upstream code and reports 10,824 errors this repo
# neither owns nor can fix, so the gate documented in CLAUDE.md stops being runnable
# verbatim -- and only for people doing KINDER work, since CI never populates them.
#
# `extend-exclude` rather than `exclude`: `exclude` *replaces* ruff's built-in defaults
# (`.git`, `__pycache__`, `.venv`, ...), which are all still wanted here.
#
# Ruff's `respect-gitignore` does not cover this. The parent repo records each submodule
# as a gitlink, so the files inside it are neither tracked nor ignored by this repo, and
# nothing stops the walk without saying so explicitly.
#
# `downward` is the same problem from the other direction: CI caches its Fast Downward
# checkout *inside* the repo root, where `ruff check .` walks 1,444 errors of upstream
# `src/translate/`, while a local checkout keeps it as a sibling directory and never
# sees it -- so this one fails only on CI, exactly inverting `reference/`.
extend-exclude = ["reference", "downward"]

[tool.ruff.lint]
# N999 bans non-lower_case.py module/file names.
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "PLR0917", "N999"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"dataclasses".msg = "Dataclasses are banned in this project — use a pydantic BaseModel instead."
"attr".msg = "Use a pydantic BaseModel instead of attrs in this project."
"attrs".msg = "Use a pydantic BaseModel instead of attrs in this project."
"typing.TYPE_CHECKING".msg = "if TYPE_CHECKING guards are banned — import the target's types.py directly instead of its ABC file, which avoids the cycle without deferring the import."

[tool.ruff.lint.pylint]
# Every parameter (beyond self/cls) must be keyword-only — this makes any
# positional-or-keyword parameter in a function we define a lint error.
max-positional-args = 0

[tool.mypy]
python_version = "3.10"
packages = ["hitl_pmp"]
ignore_missing_imports = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.importlinter]
root_packages = ["hitl_pmp"]

# Encodes core/README.md's dependency direction as an enforced contract, not just
# prose: core/ is the foundation nothing else may be imported by; practice_loop.py/
# humans/planning/adapters depend only on core and are mutually independent (nothing
# in any of the four currently imports another); method_runner.py sits above those
# (it drives practice_loop.py); environments/ sits above that (environments/<domain>/
# cli.py drives method_runner.py); methods/ sits above environments/ (a Method like
# SkillOracleMethod imports the domain it wraps); and hitl_pmp/cli.py is the true
# top, the only thing allowed to import both environments/ and methods/ directly.
# This is the exact rule a manual review missed once already (SkillOracleMethod
# briefly lived inside environments/lightswitch/ before being moved to
# methods/oracle/) -- see methods/README.md's "oracle/" section.
[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "hitl_pmp.cli",
    "hitl_pmp.methods",
    "hitl_pmp.environments",
    "hitl_pmp.cli_protocols",
    "hitl_pmp.method_runner",
    # results_writer/ sits here rather than in core/ for the reason episode_traces.py
    # already states: a ResultsWriter carries real per-run state (WandbResultsWriter
    # holds a live W&B run handle, RunProgressWriter an open file), and a stateful
    # recorder never crosses into core -- only plain data does. It reads Metrics and
    # nothing else, so it is independent of every sibling in this layer, and
    # method_runner.py above it drives the registry.
    #
    # hitl_pmp.run_progress used to be a sibling here. It is now
    # hitl_pmp.results_writer.run_progress: siblings in one layer are independent, so a
    # top-level run_progress that subclassed ResultsWriter would break this contract --
    # and a concrete ResultsWriter belongs beside the ABC and the registry anyway, the
    # same way wandb_writer.py does.
    "hitl_pmp.practice_loop | hitl_pmp.config_snapshot | hitl_pmp.sampler_draws | hitl_pmp.results_writer | hitl_pmp.humans | hitl_pmp.planning | hitl_pmp.adapters",
    # hitl_pmp.human_intervention (HumanResetTarget, "WHAT a human is asked to
    # restore") used to sit here. It is gone: WHAT and WHEN are no longer split across
    # a global flag and a method-side trigger -- asking for help is now a real ground
    # skill EES's own planner selects (ask_for_reset_task_initial/
    # ask_for_reset_random_task, up in the hitl_pmp.methods layer above), priced
    # directly rather than routed through a separate human-intervention module.
    # practice_loop.py learns a rescue is wanted by catching core's HumanHelpRequested/
    # HumanRandomTaskResetRequested and nothing else. humans/ stays in the layer above,
    # independent of both: a HumanOracle models what a human can do and what it costs,
    # never when to call one.
    #
    # recording/ sits between practice_loop.py and core/: practice_loop.py drives a
    # LoopRecorder, and a LoopRecorder knows nothing about the loop's internals --
    # it is handed State/Renderer (core) and told what just happened.
    "hitl_pmp.recording",
    "hitl_pmp.core",
]

[tool.setuptools.package-data]
hitl_pmp = ["environments/tossing3d/scenes/*.json"]
